<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PocketBawal — Official App Store &amp; Web Hub</title>
    <meta
      name="description"
      content="Official App Store &amp; Web Hub — Built from Scratch, Ready in One Click. Browse, inspect, and download custom Android APKs or launch web apps."
    />
    <meta property="og:title" content="PocketBawal — Official App Store &amp; Web Hub" />
    <meta
      property="og:description"
      content="Official App Store &amp; Web Hub — Built from Scratch, Ready in One Click. Browse, inspect, and download custom Android APKs or launch web apps."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Google Fonts: Plus Jakarta Sans & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Tailwind CSS CDN (Zero-Build GitHub Pages Ready) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      if (typeof tailwind !== 'undefined') {
        tailwind.config = {
          darkMode: 'class',
          theme: {
            extend: {
              fontFamily: {
                sans: ['"Plus Jakarta Sans"', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
                mono: ['"JetBrains Mono"', 'monospace'],
              },
            },
          },
        };
      }
    </script>

    <!-- Lucide Icons CDN -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
      :root {
        --font-sans: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
        --font-mono: 'JetBrains Mono', monospace;
      }

      * {
        box-sizing: border-box;
      }

      body {
        font-family: var(--font-sans);
        background-color: #07070B;
        color: #F8FAFC;
        overflow-x: hidden;
        margin: 0;
      }

      .font-mono {
        font-family: var(--font-mono);
      }

      .glass-surface {
        background: rgba(18, 20, 30, 0.72);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid rgba(255, 255, 255, 0.08);
      }

      .glass-surface-elevated {
        background: rgba(22, 25, 38, 0.90);
        backdrop-filter: blur(24px);
        -webkit-backdrop-filter: blur(24px);
        border: 1px solid rgba(255, 255, 255, 0.12);
      }

      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }

      @keyframes spinSlow {
        from {
          transform: rotate(0deg);
        }
        to {
          transform: rotate(360deg);
        }
      }
      .animate-spin-fast {
        animation: spinSlow 0.8s linear infinite;
      }
    </style>
  </head>

  <body class="bg-[#07070B] text-[#F8FAFC] antialiased selection:bg-[#7C3AED]/30 selection:text-white">
    <!-- Self-Contained Application Root -->
    <div
      id="top"
      class="min-h-screen bg-[#07070B] text-[#F8FAFC] relative flex flex-col justify-between overflow-x-hidden"
    >
      <!-- Ambient Radial Mesh Glows (#4C1D95 and #0891B2 at 15% opacity) -->
      <div aria-hidden="true" class="pointer-events-none fixed inset-0 overflow-hidden z-0">
        <div
          class="absolute -top-40 -left-40 w-[560px] h-[560px] rounded-full blur-[130px]"
          style="background: rgba(76, 29, 149, 0.15)"
        ></div>
        <div
          class="absolute top-1/3 -right-40 w-[520px] h-[520px] rounded-full blur-[130px]"
          style="background: rgba(8, 145, 178, 0.15)"
        ></div>
      </div>

      <!-- Sticky Glass Header (3-Zone Top Bar Contract) -->
      <header class="sticky top-0 z-30 glass-surface border-b border-white/[0.08]">
        <div class="max-w-7xl mx-auto flex items-center justify-between gap-8 px-4 sm:px-6 lg:px-8 h-16">
          <!-- Zone 1: Brand Wordmark (Tap 5 times rapidly for secret Creator Studio) -->
          <a
            href="#top"
            id="brand-logo-link"
            title="PocketBawal — Tap 5 times rapidly for Creator Studio"
            class="text-lg sm:text-xl font-extrabold tracking-tight bg-gradient-to-r from-[#F8FAFC] via-[#E2E8F0] to-[#06B6D4] bg-clip-text text-transparent whitespace-nowrap shrink-0 focus:outline-none focus-visible:ring-2 focus-visible:ring-[#7C3AED] rounded-md"
          >
            PocketBawal
          </a>

          <!-- Zone 2: Category Navigation Links -->
          <nav
            id="header-category-nav"
            aria-label="Store categories"
            class="hidden md:flex items-center gap-6 text-sm font-medium text-[#94A3B8]"
          ></nav>

          <!-- Zone 3: Primary Real-Time Search -->
          <div class="flex items-center shrink-0">
            <div class="relative flex items-center">
              <span
                aria-hidden="true"
                class="w-4 h-4 text-[#94A3B8] absolute left-3 pointer-events-none flex items-center justify-center"
                data-icon="search"
              ></span>
              <input
                id="store-search-input"
                type="search"
                placeholder="Search apps, APKs, tools..."
                aria-label="Search apps, APKs, and web tools"
                class="w-44 sm:w-60 lg:w-64 pl-9 pr-8 py-1.5 text-sm bg-white/[0.04] hover:bg-white/[0.07] focus:bg-[#0D101B] text-[#F8FAFC] placeholder-[#94A3B8] rounded-xl border border-white/[0.09] focus:border-[#06B6D4] focus:outline-none transition-colors"
              />
              <button
                id="clear-search-btn"
                type="button"
                aria-label="Clear search query"
                class="hidden absolute right-2 p-1 text-[#94A3B8] hover:text-[#F8FAFC] rounded-md cursor-pointer"
              ></button>
            </div>
          </div>
        </div>
      </header>

      <!-- Main Storefront Content -->
      <main class="relative z-10 flex-1 pb-16">
        <!-- Hero Spotlight ("Bawal Drop of the Week") -->
        <section
          id="hero-spotlight-section"
          aria-label="Bawal Drop of the Week"
          class="relative max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-6 pb-4"
        ></section>

        <!-- Interactive Category Filter Pills & Bento Grid -->
        <section
          aria-label="PocketBawal Creations Catalog"
          class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-6 space-y-6"
        >
          <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
            <div
              id="category-filter-bar"
              role="tablist"
              aria-label="Filter creations by category"
              class="flex items-center gap-2 overflow-x-auto no-scrollbar pb-1"
            ></div>
            <div
              id="catalog-count-label"
              class="text-xs font-mono tabular-nums text-[#94A3B8] shrink-0"
            ></div>
          </div>

          <div id="projects-grid-container"></div>
        </section>
      </main>

      <!-- Quiet Footer with Discreet Creator Lock Trigger -->
      <footer class="relative z-10 border-t border-white/[0.07] bg-[#07070B]/90">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 flex flex-wrap items-center justify-between gap-4 text-xs text-[#94A3B8]">
          <div class="flex flex-wrap items-center gap-2">
            <span class="font-bold text-[#F8FAFC]">PocketBawal</span>
            <span aria-hidden="true">·</span>
            <span>Official App Store &amp; Web Hub</span>
            <span aria-hidden="true">·</span>
            <span>All APKs Verified &amp; Signed</span>
          </div>

          <div class="flex items-center gap-4">
            <span>Zero-Login Public Access</span>
            <button
              id="footer-creator-lock-btn"
              type="button"
              aria-label="Creator Lock"
              title="Creator Studio Access (Owner Only)"
              class="min-h-[38px] px-3 py-1.5 rounded-xl bg-white/[0.03] hover:bg-white/[0.08] border border-white/[0.07] text-[#94A3B8] hover:text-[#F8FAFC] inline-flex items-center gap-1.5 transition-colors cursor-pointer"
            >
              <span class="w-3.5 h-3.5 text-[#7C3AED] inline-flex" data-icon="lock"></span>
              <span>Creator Studio</span>
            </button>
          </div>
        </div>
      </footer>

      <!-- Non-Blocking Action Toast -->
      <div id="toast-container" class="fixed bottom-5 right-5 z-40 pointer-events-none"></div>

      <!-- App Detail Sheet Modal Container -->
      <div id="detail-sheet-root"></div>

      <!-- Secret Admin PIN Modal Container -->
      <div id="admin-pin-modal-root"></div>

      <!-- Secret No-Code Creator Studio Modal Container -->
      <div id="admin-studio-modal-root"></div>
    </div>

        function parseImportedProjectsJson(rawJson) {
          try {
            var parsed = JSON.parse(rawJson);
            var list = Array.isArray(parsed) ? parsed : parsed && parsed.projects;
            if (!Array.isArray(list) || list.length === 0) {
              return { error: 'JSON must contain a non-empty array of ProjectItem objects.' };
            }
            var validated = [];
            for (var i = 0; i < list.length; i++) {
              var item = list[i];
              if (!item || typeof item.title !== 'string' || !item.title.trim()) {
                return { error: 'Each project item in JSON must include a valid "title".' };
              }
              validated.push({
                id: String(item.id || 'pb_' + Date.now() + '_' + i),
                title: item.title.trim(),
                tagline: String(item.tagline || 'Official PocketBawal creation.'),
                description: String(item.description || item.tagline || ''),
                changelog: String(
                  item.changelog || (item.version || 'v1.0.0') + ' — Verified build.'
                ),
                type:
                  item.type === 'apk' || item.type === 'web' || item.type === 'both'
                    ? item.type
                    : 'apk',
                category:
                  item.category === 'Android APKs' ||
                  item.category === 'Web Apps' ||
                  item.category === 'AI Tools' ||
                  item.category === 'Games'
                    ? item.category
                    : 'Android APKs',
                iconUrl: String(item.iconUrl || DEFAULT_ICONS.wallpaper3d),
                screenshots:
                  Array.isArray(item.screenshots) && item.screenshots.length > 0
                    ? item.screenshots.map(String)
                    : [DEFAULT_SCREENSHOTS.wallpaperHero1],
                apkUrl: String(item.apkUrl || ''),
                webUrl: String(item.webUrl || ''),
                version: String(item.version || 'v1.0.0'),
                fileSize: String(item.fileSize || '14.0 MB'),
                techStack: Array.isArray(item.techStack)
                  ? item.techStack.map(String)
                  : ['Kotlin'],
                downloads: Number(item.downloads) || 0,
                isFeatured: Boolean(item.isFeatured),
                createdAt: String(item.createdAt || new Date().toISOString()),
              });
            }
            return { projects: validated };
          } catch (err) {
            return { error: 'Invalid JSON syntax. Please check your backup file.' };
          }
        }

            var manifestBlob = new Blob(

                'POCKETBAWAL-SIGNED-APK-PACKAGE\nApp: ' +
                  project.title +
                  '\nVersion: ' +
                  project.version +
                  '\nSize: ' +
                  project.fileSize +
                  '\nSource: ' +
                  project.apkUrl +
                  '\nTimestamp: ' +
                  new Date().toISOString() +
                  '\n',
              ],
              { type: 'application/vnd.android.package-archive' }
            );
            link.href = URL.createObjectURL(manifestBlob);
          }
          link.download = filename;
          document.body.appendChild(link);
          link.click();
          document.body.removeChild(link);

          setTimeout(function () {
            state.downloadStates[project.id] = 'done';
            renderStorefront();
            if (state.selectedProjectId === project.id) renderDetailSheet();
            showToast('Downloaded ' + filename + ' (' + project.fileSize + ')');

            setTimeout(function () {
              state.downloadStates[project.id] = 'idle';
              renderStorefront();
              if (state.selectedProjectId === project.id) renderDetailSheet();
            }, 2600);
          }, 600);
        }

        function triggerWebLaunch(projectId) {
          var project = state.projects.find(function (p) {

          if (!project) return;
          project.downloads = (Number(project.downloads) || 0) + 1;
          persistProjects();
          renderStorefront();
          if (state.selectedProjectId === project.id) renderDetailSheet();

          var targetUrl = project.webUrl || 'https://pocketbawal.dev';
          var link = document.createElement('a');
          link.href = targetUrl;
          link.target = '_blank';
          link.rel = 'noopener noreferrer';
          document.body.appendChild(link);
          link.click();
          document.body.removeChild(link);

          showToast('Launching ' + project.title + ' in new tab...');
        }

        function syncDraftFormFromDom() {
          var titleEl = document.getElementById('proj-title');
          var taglineEl = document.getElementById('proj-tagline');
          var catEl = document.getElementById('proj-category');
          var apkUrlEl = document.getElementById('proj-apk-url');
          var verEl =
            document.getElementById('proj-version') ||
            document.getElementById('proj-web-version');
          var sizeEl = document.getElementById('proj-size');
          var webUrlEl = document.getElementById('proj-web-url');
          var descEl = document.getElementById('proj-desc');
          var changelogEl = document.getElementById('proj-changelog');
          var iconUrlEl = document.getElementById('proj-icon-url');
          var shotUrlEl = document.getElementById('proj-screenshot-url');
          var techEl = document.getElementById('proj-tech');
          var featEl = document.getElementById('proj-featured-checkbox');

          if (titleEl) state.form.title = titleEl.value;
          if (taglineEl) state.form.tagline = taglineEl.value;
          if (catEl) state.form.category = catEl.value;
          if (apkUrlEl) state.form.apkUrl = apkUrlEl.value;
          if (verEl) state.form.version = verEl.value;
          if (sizeEl) state.form.fileSize = sizeEl.value;
          if (webUrlEl) state.form.webUrl = webUrlEl.value;
          if (descEl) state.form.description = descEl.value;
          if (changelogEl) state.form.changelog = changelogEl.value;
          if (iconUrlEl) state.form.iconUrl = iconUrlEl.value;
          if (shotUrlEl) state.screenshotUrlInput = shotUrlEl.value;
          if (techEl) state.techInput = techEl.value;
          if (featEl) state.form.isFeatured = Boolean(featEl.checked);
        }

        function bindStudioFormInputs() {
          var taglineEl = document.getElementById('proj-tagline');
          if (taglineEl) {
            taglineEl.addEventListener('input', function () {
              state.form.tagline = taglineEl.value;
              var counter = document.getElementById('tagline-char-counter');
              if (counter) counter.textContent = taglineEl.value.length + '/80';
            });
          }

          var apkFileInput = document.getElementById('studio-apk-file-input');
          if (apkFileInput) {
            apkFileInput.addEventListener('change', function (e) {
              syncDraftFormFromDom();
              var file = e.target.files && e.target.files[0];
              if (!file) return;
              var sizeMb = (file.size / (1024 * 1024)).toFixed(1);
              state.form.apkUrl = URL.createObjectURL(file);
              state.form.fileSize = sizeMb + ' MB';
              showStudioStatus('Attached ' + file.name + ' (' + sizeMb + ' MB)');
            });
          }

          var iconFileInput = document.getElementById('studio-icon-file-input');
          if (iconFileInput) {
            iconFileInput.addEventListener('change', function (e) {
              syncDraftFormFromDom();
              var file = e.target.files && e.target.files[0];
              if (!file) return;
              var reader = new FileReader();
              reader.onload = function () {
                if (typeof reader.result === 'string') {
                  state.form.iconUrl = reader.result;
                  renderAdminStudioModal();
                }
              };
              reader.readAsDataURL(file);
            });
          }

          var shotsFileInput = document.getElementById('studio-screenshots-file-input');
          if (shotsFileInput) {
            shotsFileInput.addEventListener('change', function (e) {
              syncDraftFormFromDom();
              var files = e.target.files;
              if (!files || files.length === 0) return;
              Array.from(files).forEach(function (file) {
                var reader = new FileReader();
                reader.onload = function () {
                  if (typeof reader.result === 'string') {
                    state.form.screenshots.push(reader.result);
                    renderAdminStudioModal();
                  }
                };
                reader.readAsDataURL(file);
              });
            });
          }

          var importJsonInput = document.getElementById('studio-import-json-file');
          if (importJsonInput) {
            importJsonInput.addEventListener('change', function (e) {
              var file = e.target.files && e.target.files[0];
              if (!file) return;
              var reader = new FileReader();
              reader.onload = function () {
                var content = typeof reader.result === 'string' ? reader.result : '';
                var parsed = parseImportedProjectsJson(content);
                if (parsed.error || !parsed.projects) {
                  state.syncMessage = parsed.error || 'Failed to import JSON.';
                  renderAdminStudioModal();
                } else {
                  state.projects = parsed.projects;
                  persistProjects();
                  state.syncMessage =
                    'Successfully imported ' + parsed.projects.length + ' creations!';
                  renderStorefront();
                  showStudioStatus('Imported ' + parsed.projects.length + ' creations!');
                }
              };
              reader.readAsText(file);
            });
          }
        }

        // ---------------------------------------------------------------------------
        // 10. EVENT DELEGATION & INITIALIZATION
        // ---------------------------------------------------------------------------
        function initStaticIconsAndEvents() {
          document.querySelectorAll('[data-icon]').forEach(function (el) {
            var name = el.getAttribute('data-icon');
            if (name && SVG_ICONS[name]) el.innerHTML = SVG_ICONS[name];
          });

          var clearBtn = document.getElementById('clear-search-btn');
          if (clearBtn) clearBtn.innerHTML = iconHtml('x', 'w-3.5 h-3.5');

          var searchInput = document.getElementById('store-search-input');
          if (searchInput) {
            searchInput.addEventListener('input', function () {
              state.searchQuery = searchInput.value;
              if (clearBtn) {
                if (state.searchQuery) clearBtn.classList.remove('hidden');
                else clearBtn.classList.add('hidden');
              }
              renderCategoryPillsAndGrid();
            });
          }

          if (clearBtn) {
            clearBtn.addEventListener('click', function () {
              state.searchQuery = '';
              if (searchInput) {
                searchInput.value = '';
                searchInput.focus();
              }
              clearBtn.classList.add('hidden');
              renderCategoryPillsAndGrid();
            });
          }

          // 5-tap secret Admin trigger on PocketBawal logo
          var logoLink = document.getElementById('brand-logo-link');
          if (logoLink) {
            logoLink.addEventListener('click', function (e) {
              e.preventDefault();
              var now = Date.now();
              state.logoTapTimestamps = state.logoTapTimestamps.filter(function (t) {
                return now - t < 1800;
              });
              state.logoTapTimestamps.push(now);
              if (state.logoTapTimestamps.length >= 5) {
                state.logoTapTimestamps = [];
                openSecretAdminTrigger();
              }
            });
          }

          var footerLockBtn = document.getElementById('footer-creator-lock-btn');
          if (footerLockBtn) {
            footerLockBtn.addEventListener('click', function () {
              openSecretAdminTrigger();
            });
          }

          // Global Click Delegation
          document.addEventListener('click', function (e) {
            var actionEl = e.target.closest('[data-action]');
            if (!actionEl) return;
            var action = actionEl.getAttribute('data-action');

            if (action === 'select-category') {
              e.stopPropagation();
              state.selectedCategory =
                actionEl.getAttribute('data-category') || 'All Creations';
              renderStorefront();
            } else if (action === 'reset-filters') {
              e.stopPropagation();
              state.selectedCategory = 'All Creations';
              state.searchQuery = '';
              var sInput = document.getElementById('store-search-input');
              if (sInput) sInput.value = '';
              if (clearBtn) clearBtn.classList.add('hidden');
              renderStorefront();
            } else if (action === 'download-apk') {
              e.stopPropagation();
              triggerApkDownload(actionEl.getAttribute('data-id'));
            } else if (action === 'launch-web') {
              e.stopPropagation();
              triggerWebLaunch(actionEl.getAttribute('data-id'));
            } else if (action === 'inspect-project') {
              state.selectedProjectId = actionEl.getAttribute('data-id');
              state.copiedLink = false;
              renderDetailSheet();
            } else if (
              action === 'close-detail' ||
              (action === 'close-detail-backdrop' && e.target === actionEl)
            ) {
              state.selectedProjectId = null;
              renderDetailSheet();
            } else if (action === 'share-project') {
              e.stopPropagation();
              var pid = actionEl.getAttribute('data-id');
              var shareUrl =
                window.location.origin +
                window.location.pathname +
                '?app=' +
                encodeURIComponent(pid || '');
              if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(shareUrl).catch(function () {});
              }
              state.copiedLink = true;
              renderDetailSheet();
              setTimeout(function () {
                state.copiedLink = false;
                if (state.selectedProjectId === pid) renderDetailSheet();
              }, 2200);
            } else if (
              action === 'close-pin-modal' ||
              (action === 'close-pin-backdrop' && e.target === actionEl)
            ) {
              state.isPinModalOpen = false;
              renderAdminPinModal();
            } else if (
              action === 'close-studio' ||
              (action === 'close-studio-backdrop' && e.target === actionEl)
            ) {
              state.isAdminStudioOpen = false;
              renderAdminStudioModal();
            } else if (action === 'set-studio-tab') {
              syncDraftFormFromDom();
              state.adminActiveTab = actionEl.getAttribute('data-tab') || 'publish';
              renderAdminStudioModal();
            } else if (action === 'set-form-type') {
              syncDraftFormFromDom();
              var newType = actionEl.getAttribute('data-type') || 'apk';
              state.form.type = newType;
              if (newType === 'web') state.form.fileSize = 'Cloud';
              else if (state.form.fileSize === 'Cloud')
                state.form.fileSize = '14.5 MB';
              renderAdminStudioModal();
            } else if (action === 'add-screenshot-url') {
              syncDraftFormFromDom();
              if (state.screenshotUrlInput.trim()) {
                state.form.screenshots.push(state.screenshotUrlInput.trim());
                state.screenshotUrlInput = '';
                renderAdminStudioModal();
              }
            } else if (action === 'remove-screenshot') {
              syncDraftFormFromDom();
              var rmIdx = Number(actionEl.getAttribute('data-index'));
              state.form.screenshots = state.form.screenshots.filter(function (_, i) {
                return i !== rmIdx;
              });
              renderAdminStudioModal();
            } else if (action === 'reset-publish-form') {
              state.editingId = null;
              state.form = getEmptyForm();
              state.techInput = 'Kotlin, Android';
              state.screenshotUrlInput = '';
              state.formError = '';
              renderAdminStudioModal();
            } else if (action === 'switch-to-new-publish') {
              state.editingId = null;
              state.form = getEmptyForm();
              state.techInput = 'Kotlin, Android';
              state.formError = '';
              state.adminActiveTab = 'publish';
              renderAdminStudioModal();
            } else if (action === 'toggle-featured') {
              var targetId = actionEl.getAttribute('data-id');
              state.projects = state.projects.map(function (p) {
                return Object.assign({}, p, { isFeatured: p.id === targetId });
              });
              persistProjects();
              renderStorefront();
              renderAdminStudioModal();
            } else if (action === 'edit-project') {
              var editId = actionEl.getAttribute('data-id');
              var item = state.projects.find(function (p) {
                return p.id === editId;
              });
              if (item) {
                state.editingId = item.id;
                state.form = {
                  title: item.title,
                  tagline: item.tagline,
                  description: item.description,
                  changelog: item.changelog || '',
                  type: item.type,
                  category: item.category,
                  iconUrl: item.iconUrl,
                  screenshots: (item.screenshots || []).slice(),
                  apkUrl: item.apkUrl || '',
                  webUrl: item.webUrl || '',
                  version: item.version || 'v1.0.0',
                  fileSize: item.fileSize || '15.0 MB',
                  techStack: (item.techStack || []).slice(),
                  isFeatured: Boolean(item.isFeatured),
                };
                state.techInput = (item.techStack || []).join(', ');
                state.formError = '';
                state.adminActiveTab = 'publish';
                renderAdminStudioModal();
              }
            } else if (action === 'delete-project') {
              var delId = actionEl.getAttribute('data-id');
              var delItem = state.projects.find(function (p) {
                return p.id === delId;
              });
              state.projects = state.projects.filter(function (p) {
                return p.id !== delId;
              });
              if (
                state.projects.length > 0 &&
                !state.projects.some(function (p) {
                  return p.isFeatured;
                })
              ) {
                state.projects[0].isFeatured = true;
              }
              persistProjects();
              if (state.selectedProjectId === delId) {
                state.selectedProjectId = null;
                renderDetailSheet();
              }
              renderStorefront();
              showStudioStatus(
                'Deleted "' + (delItem ? delItem.title : 'Creation') + '"'
              );
            } else if (action === 'export-json') {
              var dataStr = JSON.stringify(state.projects, null, 2);
              var blob = new Blob([dataStr], { type: 'application/json' });
              var url = URL.createObjectURL(blob);
              var a = document.createElement('a');
              a.href = url;
              a.download =
                'pocketbawal-store-backup-' +
                new Date().toISOString().slice(0, 10) +
                '.json';
              document.body.appendChild(a);
              a.click();
              document.body.removeChild(a);
              URL.revokeObjectURL(url);
              showStudioStatus('Exported PocketBawal JSON backup!');
            } else if (action === 'reset-demo-data') {
              state.projects = INITIAL_PROJECTS.slice();
              persistProjects();
              renderStorefront();
              showStudioStatus('Restored default PocketBawal catalog');
            } else if (action === 'load-raw-json') {
              var rawInput = document.getElementById('raw-json-import');
              var rawVal = rawInput ? rawInput.value : '';
              var parsed = parseImportedProjectsJson(rawVal);
              if (parsed.error || !parsed.projects) {
                state.syncMessage = parsed.error || 'Invalid JSON.';
                renderAdminStudioModal();
              } else {
                state.projects = parsed.projects;
                persistProjects();
                state.syncMessage =
                  'Imported ' + parsed.projects.length + ' creations from JSON!';
                renderStorefront();
                showStudioStatus(
                  'Imported ' + parsed.projects.length + ' creations!'
                );
              }
            } else if (action === 'save-cloud-config') {
              var provEl = document.getElementById('cloud-provider');
              var endEl = document.getElementById('cloud-endpoint');
              var keyEl = document.getElementById('cloud-apikey');
              state.cloudConfig = {
                provider: provEl ? provEl.value : 'none',
                endpointUrl: endEl ? endEl.value.trim() : '',
                apiKey: keyEl ? keyEl.value.trim() : '',
                autoSync: false,
              };
              try {
                localStorage.setItem(
                  STORAGE_KEY_CLOUD,
                  JSON.stringify(state.cloudConfig)
                );
              } catch (err) {}
              state.syncMessage = 'Saved Cloud Database configuration.';
              showStudioStatus('Saved Cloud Config');
            } else if (
              action === 'cloud-sync-push' ||
              action === 'cloud-sync-pull'
            ) {
              var provEl2 = document.getElementById('cloud-provider');
              var endEl2 = document.getElementById('cloud-endpoint');
              var keyEl2 = document.getElementById('cloud-apikey');
              state.cloudConfig = {
                provider: provEl2 ? provEl2.value : state.cloudConfig.provider,
                endpointUrl: endEl2
                  ? endEl2.value.trim()
                  : state.cloudConfig.endpointUrl,
                apiKey: keyEl2 ? keyEl2.value.trim() : state.cloudConfig.apiKey,
                autoSync: false,
              };
              if (!state.cloudConfig.endpointUrl) {
                state.syncMessage = 'Please enter a valid Cloud Endpoint URL first.';
                renderAdminStudioModal();
                return;
              }
              var headers = { 'Content-Type': 'application/json' };
              if (state.cloudConfig.apiKey) {
                if (state.cloudConfig.provider === 'jsonbin') {
                  headers['X-Master-Key'] = state.cloudConfig.apiKey;
                } else {
                  headers['Authorization'] = 'Bearer ' + state.cloudConfig.apiKey;
                }
              }
              if (action === 'cloud-sync-push') {
                fetch(state.cloudConfig.endpointUrl, {
                  method:
                    state.cloudConfig.provider === 'jsonbin' ? 'PUT' : 'POST',
                  headers: headers,
                  body: JSON.stringify({ projects: state.projects }),
                })
                  .then(function (res) {
                    state.syncMessage = res.ok
                      ? 'Synced ' + state.projects.length + ' creations to Cloud!'
                      : 'Cloud push HTTP ' + res.status;
                    renderAdminStudioModal();
                  })
                  .catch(function () {
                    state.syncMessage =
                      'Network offline — LocalStorage backup active.';
                    renderAdminStudioModal();
                  });
              } else {
                fetch(state.cloudConfig.endpointUrl, {
                  method: 'GET',
                  headers: headers,
                })
                  .then(function (res) {
                    return res.json();
                  })
                  .then(function (data) {
                    var list =
                      (data && data.record && data.record.projects) ||
                      (data && data.projects) ||
                      data;
                    var parsed2 = parseImportedProjectsJson(JSON.stringify(list));
                    if (parsed2.projects) {
                      state.projects = parsed2.projects;
                      persistProjects();
                      state.syncMessage =
                        'Pulled ' + parsed2.projects.length + ' creations from Cloud!';
                      renderStorefront();
                    } else {
                      state.syncMessage =
                        parsed2.error || 'Invalid cloud schema.';
                    }
                    renderAdminStudioModal();
                  })
                  .catch(function () {
                    state.syncMessage = 'Cloud pull failed — using LocalStorage.';
                    renderAdminStudioModal();
                  });
              }
            } else if (action === 'update-admin-pin') {
              var newPinEl = document.getElementById('new-admin-pin-input');
              if (newPinEl && newPinEl.value.trim()) {
                state.adminPin = newPinEl.value.trim();
                try {
                  localStorage.setItem(STORAGE_KEY_PIN, state.adminPin);
                } catch (err) {}
                showStudioStatus('Updated Creator PIN!');
              }
            }
          });

          // Form Submit Delegation (PIN Modal & Publish Creation Form)
          document.addEventListener('submit', function (e) {
            if (e.target && e.target.id === 'admin-pin-form') {
              e.preventDefault();
              var pinInput = document.getElementById('creator-pin-input');
              var entered = pinInput ? pinInput.value.trim() : '';
              if (entered === state.adminPin.trim() && state.adminPin.trim().length > 0) {
                state.isPinModalOpen = false;
                state.pinError = '';
                state.isAdminUnlocked = true;
                state.isAdminStudioOpen = true;
                renderAdminPinModal();
                renderAdminStudioModal();
              } else {
                state.pinError = 'Invalid Creator PIN. Default demo PIN is 2026.';
                renderAdminPinModal();
              }
            } else if (e.target && e.target.id === 'studio-publish-form') {
              e.preventDefault();
              syncDraftFormFromDom();
              var f = state.form;
              if (!f.title.trim()) {
                state.formError = 'Project title is required.';
                renderAdminStudioModal();
                return;
              }
              if (!f.tagline.trim()) {
                state.formError = 'Short tagline is required.';
                renderAdminStudioModal();
                return;
              }
              if (f.tagline.trim().length > 80) {
                state.formError = 'Short tagline must be 80 characters or fewer.';
                renderAdminStudioModal();
                return;
              }
              if (!f.description.trim()) {
                state.formError = 'Project description is required.';
                renderAdminStudioModal();
                return;
              }
              if ((f.type === 'apk' || f.type === 'both') && !f.apkUrl.trim()) {
                state.formError =
                  'Please provide an APK file or direct download URL.';
                renderAdminStudioModal();
                return;
              }
              if ((f.type === 'web' || f.type === 'both') && !f.webUrl.trim()) {
                state.formError =
                  'Please provide a live website URL (https://...).';
                renderAdminStudioModal();
                return;
              }

              var verRaw = f.version.trim() || 'v1.0.0';
              var normalizedVer =
                verRaw.indexOf('v') === 0 ? verRaw : 'v' + verRaw;
              var stackArr = state.techInput
                .split(',')
                .map(function (s) {
                  return s.trim();
                })
                .filter(Boolean);
              if (stackArr.length === 0) {
                stackArr = f.type === 'apk' ? ['Kotlin', 'Android'] : ['HTML5', 'Web'];
              }

              if (f.isFeatured) {
                state.projects = state.projects.map(function (p) {
                  return Object.assign({}, p, { isFeatured: false });
                });
              }

              var savedTitle = f.title.trim();
              var wasEdit = Boolean(state.editingId);

              if (state.editingId) {
                state.projects = state.projects.map(function (item) {
                  if (item.id !== state.editingId) return item;
                  return Object.assign({}, item, {
                    title: f.title.trim(),
                    tagline: f.tagline.trim(),
                    description: f.description.trim(),
                    changelog: f.changelog.trim() || item.changelog,
                    type: f.type,
                    category: f.category,
                    iconUrl: f.iconUrl.trim() || DEFAULT_ICONS.wallpaper3d,
                    screenshots:
                      f.screenshots.length > 0
                        ? f.screenshots.slice()
                        : [DEFAULT_SCREENSHOTS.wallpaperHero1],
                    apkUrl: f.type === 'web' ? '' : f.apkUrl.trim(),
                    webUrl: f.type === 'apk' ? '' : f.webUrl.trim(),
                    version: normalizedVer,
                    fileSize:
                      f.type === 'web' ? 'Cloud' : f.fileSize.trim() || '14.5 MB',
                    techStack: stackArr,
                    isFeatured: Boolean(f.isFeatured),
                  });
                });
              } else {
                var newProj = {
                  id: 'pb_' + Date.now(),
                  title: f.title.trim(),
                  tagline: f.tagline.trim(),
                  description: f.description.trim(),
                  changelog:
                    f.changelog.trim() ||
                    normalizedVer + ' — Initial official release on PocketBawal.',
                  type: f.type,
                  category: f.category,
                  iconUrl: f.iconUrl.trim() || DEFAULT_ICONS.wallpaper3d,
                  screenshots:
                    f.screenshots.length > 0
                      ? f.screenshots.slice()
                      : [DEFAULT_SCREENSHOTS.wallpaperHero1],
                  apkUrl: f.type === 'web' ? '' : f.apkUrl.trim(),
                  webUrl: f.type === 'apk' ? '' : f.webUrl.trim(),
                  version: normalizedVer,
                  fileSize:
                    f.type === 'web' ? 'Cloud' : f.fileSize.trim() || '14.5 MB',
                  techStack: stackArr,
                  downloads: 1,
                  isFeatured: Boolean(f.isFeatured),
                  createdAt: new Date().toISOString(),
                };
                state.projects = [newProj].concat(state.projects);
              }

              persistProjects();
              state.editingId = null;
              state.form = getEmptyForm();
              state.techInput = 'Kotlin, Android';
              state.screenshotUrlInput = '';
              state.formError = '';
              renderStorefront();
              showStudioStatus(
                (wasEdit ? 'Updated "' : 'Published "') +
                  savedTitle +
                  '" to PocketBawal!'
              );
            }
          });

          // Deep-link support (?app=pb_...)
          try {
            var params = new URLSearchParams(window.location.search);
            var appParam = params.get('app');
            if (
              appParam &&
              state.projects.some(function (p) {
                return p.id === appParam;
              })
            ) {
              state.selectedProjectId = appParam;
              renderDetailSheet();
            }
          } catch (e) {}
        }

        // Boot Application
        initStaticIconsAndEvents();
        renderStorefront();
      })();
    </script>
  </body>
</html>
